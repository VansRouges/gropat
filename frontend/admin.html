<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROPATShift — Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }
    
    .control-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .search-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 300px;
    }
    
    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 300px;
    }
    
    .control-row label {
      font-weight: 600;
      color: #495057;
      white-space: nowrap;
    }
    
    .control-row input,
    .control-row select,
    .control-row button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .control-row input[type="email"] {
      min-width: 200px;
      flex: 1;
    }
    
    .control-row input[type="date"] {
      min-width: 140px;
    }
    
    .control-row select {
      min-width: 180px;
    }
    
    .primary-btn {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    
    .primary-btn:hover {
      background-color: #0056b3;
    }
    
    .clear-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    
    .clear-btn:hover {
      background-color: #c82333;
    }
    
    .booking-row {
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .booking-row:hover {
      background-color: #f5f5f5;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: white;
      margin: 5% auto;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      position: relative;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover {
      color: black;
    }
    .detail-item {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .detail-label {
      font-weight: bold;
      color: #333;
    }
    
    .search-results-info {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background-color: #e7f3ff;
      border: 1px solid #b6d7ff;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h2>Recent Bookings</h2>
    
    <div class="admin-controls">
      <div class="control-row">
        <div class="search-group">
          <label for="emailSearch">Search by Email:</label>
          <input type="email" id="emailSearch" placeholder="Enter email address..." />
          <button type="button" class="clear-btn" id="clearSearch">Clear</button>
        </div>
      </div>
      
      <div class="control-row">
        <div class="filter-group">
          <label for="filterDate">Filter by Date:</label>
          <input type="date" id="filterDate" />
          <button id="loadBtn" class="primary-btn">Refresh</button>
        </div>
      </div>
      
      <div class="control-row">
        <div class="filter-group">
          <label for="sortBy">Sort by:</label>
          <select id="sortBy">
            <option value="created_at">Created Date (newest first)</option>
            <option value="email">Email (A-Z)</option>
            <option value="name">Name (A-Z)</option>
            <option value="date">Shift Date</option>
          </select>
        </div>
      </div>
    </div>
    
    <div id="list"></div>
    
    <!-- Modal for booking details -->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Booking Details</h3>
        <div id="bookingDetails"></div>
      </div>
    </div>
  </main>
  
  <script src="env.js"></script>
  <script>
    const API_BASE = (function() {
      // Use environment config if available
      if (window.ENV && window.ENV.API_BASE) {
        return window.ENV.API_BASE.replace(/\/$/, '');
      }
      // Fallback for local development
      const origin = window.location.origin;
      if (origin === 'null' || origin.startsWith('file:')) return 'http://localhost:3001';
      return '';
    })();

    async function load() {
      const date = document.getElementById('filterDate').value;
      const sortBy = document.getElementById('sortBy').value;
      const email = document.getElementById('emailSearch').value.trim();
      
      try {
        let res, data;
        
        if (email) {
          // Use dedicated email search endpoint
          const q = new URLSearchParams();
          q.set('email', email);
          if (sortBy) q.set('sort', sortBy);
          
          const emailUrl = `${API_BASE}/api/bookings/search?${q.toString()}`;
          console.log('Email search URL:', emailUrl); // Debug log
          
          res = await fetch(emailUrl);
          
          if (!res.ok) {
            console.error('Response not OK:', res.status, res.statusText);
            const errorText = await res.text();
            console.error('Error response:', errorText);
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          
          data = await res.json();
          console.log('Email search response:', data); // Debug log
        } else {
          // Use general bookings endpoint with optional date filter
          const q = new URLSearchParams();
          if (date) q.set('date', date);
          if (sortBy) q.set('sort', sortBy);
          
          const generalUrl = `${API_BASE}/api/bookings${q.toString() ? '?' + q.toString() : ''}`;
          console.log('General search URL:', generalUrl); // Debug log
          
          res = await fetch(generalUrl);
          
          if (!res.ok) {
            console.error('Response not OK:', res.status, res.statusText);
            const errorText = await res.text();
            console.error('Error response:', errorText);
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          
          data = await res.json();
        }
        
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        if (!Array.isArray(data) || data.length === 0) {
          if (email) {
            list.innerHTML = `
              <div class="search-results-info">
                <strong>No Results Found</strong><br>
                No bookings found for email: <em>${email}</em><br>
                <small>Check the email address and try again.</small>
              </div>
            `;
          } else {
            list.innerHTML = '<p>No bookings found.</p>';
          }
          return;
        }
        
        // Server already handles sorting, but keep client-side as fallback
        let sortedData = [...data];
        if (sortBy === 'email') {
          sortedData.sort((a, b) => a.email.localeCompare(b.email));
        } else if (sortBy === 'name') {
          sortedData.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'date') {
          sortedData.sort((a, b) => new Date(a.date) - new Date(b.date));
        } else if (sortBy === 'created_at') {
          sortedData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }
        
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.innerHTML = '<thead><tr><th>Name</th><th>Email</th><th>Date</th><th>Time</th><th>Created</th></tr></thead>';
        const tbody = document.createElement('tbody');
        
        sortedData.forEach(b => {
          const tr = document.createElement('tr');
          tr.className = 'booking-row';
          tr.dataset.bookingId = b._id;
          
          const createdDate = new Date(b.created_at).toLocaleDateString() + ' ' + new Date(b.created_at).toLocaleTimeString();
          tr.innerHTML = `<td>${b.name}</td><td>${b.email}</td><td>${b.date}</td><td>${b.time}</td><td>${createdDate}</td>`;
          
          Array.from(tr.children).forEach(td => { 
            td.style.borderTop = '1px solid #eee'; 
            td.style.padding = '6px'; 
          });
          
          tr.addEventListener('click', () => showBookingDetails(b));
          tbody.appendChild(tr);
        });
        
        table.appendChild(tbody);
        list.appendChild(table);
        
        // Show search results info
        if (email) {
          const info = document.createElement('div');
          info.className = 'search-results-info';
          info.innerHTML = `
            <strong>Search Results:</strong> Found ${sortedData.length} booking(s) for email: <em>${email}</em>
          `;
          list.insertBefore(info, table);
        }
        
      } catch (error) {
        console.error('Error loading bookings:', error);
        document.getElementById('list').innerHTML = '<p>Error loading bookings: ' + error.message + '</p>';
      }
    }

    function showBookingDetails(booking) {
      const modal = document.getElementById('bookingModal');
      const details = document.getElementById('bookingDetails');
      
      const createdDate = new Date(booking.created_at);
      const updatedDate = booking.updated_at ? new Date(booking.updated_at) : null;
      
      details.innerHTML = `
        <div class="detail-item">
          <div class="detail-label">Booking ID:</div>
          <div>${booking._id}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Name:</div>
          <div>${booking.name}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Email:</div>
          <div>${booking.email}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Shift Date:</div>
          <div>${booking.date}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Time Slot:</div>
          <div>${booking.time}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Created:</div>
          <div>${createdDate.toLocaleDateString()} at ${createdDate.toLocaleTimeString()}</div>
        </div>
        ${updatedDate ? `
        <div class="detail-item">
          <div class="detail-label">Last Updated:</div>
          <div>${updatedDate.toLocaleDateString()} at ${updatedDate.toLocaleTimeString()}</div>
        </div>
        ` : ''}
      `;
      
      modal.style.display = 'block';
    }

    // Event listeners
    document.getElementById('loadBtn').addEventListener('click', load);
    document.getElementById('sortBy').addEventListener('change', load);
    
    // Email search functionality
    document.getElementById('emailSearch').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        load();
      }
    });
    
    document.getElementById('clearSearch').addEventListener('click', () => {
      document.getElementById('emailSearch').value = '';
      load();
    });
    
    // Modal functionality
    document.querySelector('.close').addEventListener('click', () => {
      document.getElementById('bookingModal').style.display = 'none';
    });
    
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('bookingModal');
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
    
    // Load initial data
    load();
  </script>
</body>
</html>
