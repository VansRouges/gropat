<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROPATShift — Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h2>Recent Bookings</h2>
    <div>
      <label for="filterDate">Date</label>
      <input type="date" id="filterDate" />
      <button id="loadBtn">Load</button>
    </div>
    <div id="list"></div>
  </main>
  <script src="env.js"></script>
  <script>
    const API_BASE = (function() {
      // Use environment config if available
      if (window.ENV && window.ENV.API_BASE) {
        return window.ENV.API_BASE.replace(/\/$/, '');
      }
      // Fallback for local development
      const origin = window.location.origin;
      if (origin === 'null' || origin.startsWith('file:')) return 'http://localhost:3001';
      return '';
    })();

    async function load() {
      const date = document.getElementById('filterDate').value;
      const q = new URLSearchParams();
      if (date) q.set('date', date);
      const res = await fetch(`${API_BASE}/api/bookings?${q.toString()}`);
      const data = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (!Array.isArray(data) || data.length === 0) {
        list.textContent = 'No bookings found.';
        return;
      }
      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';
      table.innerHTML = '<thead><tr><th>Name</th><th>Email</th><th>Date</th><th>Time</th><th>Created</th></tr></thead>';
      const tbody = document.createElement('tbody');
      data.forEach(b => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${b.name}</td><td>${b.email}</td><td>${b.date}</td><td>${b.time}</td><td>${b.created_at}</td>`;
        Array.from(tr.children).forEach(td => { td.style.borderTop = '1px solid #eee'; td.style.padding = '6px'; });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      list.appendChild(table);
    }
    document.getElementById('loadBtn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
